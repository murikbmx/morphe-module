enable-module-update = true # set this to false if you do not want to receive updates for the module
parallel-jobs = 1

# Default patches: Dual VoT (Morphe + Google/other and Yandex voice-over translation)
# https://github.com/sashade8-ship-it/dual-vot-patches
patches-source = "sashade8-ship-it/dual-vot-patches"
patches-version = "latest" # 'latest' (stable), 'dev' (newest release incl. pre-releases) or a tag, e.g. "v2.0.0-dualvot.8.5.4"
cli-source = "MorpheApp/morphe-cli"
cli-version = "latest"

# see CONFIG.md for more detailed explanations
# stock apk sources, in this order: own storage (stock-apks release), archive.org, APKMirror, Uptodown.
# APKMirror and Uptodown are skipped on GitHub (blocked there / captcha), they are used only for local builds

# Stable channel (default branch): latest stable dual-vot-patches release
# the dev channel lives in the "dev" branch
[YouTube]
app-name = "YouTube"
pkg-name = "com.google.android.youtube"
rv-brand = "DualVoT"
build-mode = "both" # module for root (KernelSU/Magisk) + non-root APK (needs MicroG-RE)
arch = "arm64-v8a"
version = "auto" # newest version supported by the patches, downloaded exactly
module-prop-name = "youtube-dualvot"
included-patches = "'Voice over translation' 'Yandex voice-over translation'"
module-excluded-patches = "'Spoof video streams'" # not needed with root: the module uses the real Google services
# Default values of Morphe settings baked into the APK and the module (can still be changed in Morphe settings).
# key=value, separated by spaces/new lines. The build of this app fails if a key is not found in the patches.
#   morphe_header_logo                 Header logo: DEFAULT, REGULAR, PREMIUM, MORPHE
#   morphe_shorts_autoplay             Autoplay Shorts: true / false
#   morphe_video_quality_default_wifi  Default video quality on Wi-Fi: -2 (auto), 2160, 1440, 1080, 720, 480, 360, 240, 144
#   morphe_shorts_quality_default_wifi Default Shorts quality on Wi-Fi: -2 (auto), 2160, 1440, 1080, 720, 480, 360, 240
#   morphe_hide_end_screen_suggested_video  Hide suggested video at the end of a video: true / false
#   morphe_hide_end_screen_cards       Hide end screen cards (next video tiles): true / false
settings-defaults = """
  morphe_header_logo=PREMIUM
  morphe_shorts_autoplay=true
  morphe_video_quality_default_wifi=1080
  morphe_shorts_quality_default_wifi=1080
  morphe_hide_end_screen_suggested_video=true
  morphe_hide_end_screen_cards=true
  """
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.youtube"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
uptodown-dlurl = "https://youtube.en.uptodown.com/android"

# Google Photos with De-Vanced patches (Morphe based): Pixel spoofing for unlimited storage, MicroG support
# https://github.com/RookieEnough/De-Vanced
[GooglePhotos]
app-name = "GooglePhotos"
pkg-name = "com.google.android.apps.photos"
patches-source = "RookieEnough/De-Vanced"
patches-version = "latest"
rv-brand = "DeVanced"
build-mode = "both" # module for root (KernelSU/Magisk) + non-root APK (needs MicroG-RE)
arch = "arm64-v8a"
version = "auto"
module-prop-name = "googlephotos-devanced"
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.apps.photos"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/photos"

# Gboard with jasonwu1994/Gboard-patches (Morphe based). Non-root APK only.
# "Package Rename" (on by default) installs it next to the original Gboard as "GboardWu"
# https://github.com/jasonwu1994/Gboard-patches
[Gboard]
app-name = "Gboard"
pkg-name = "com.google.android.inputmethod.latin"
patches-source = "jasonwu1994/Gboard-patches"
patches-version = "latest"
rv-brand = "Wu"
build-mode = "apk"
arch = "arm64-v8a"
version = "auto"
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.inputmethod.latin"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/gboard"

# Gboard Lite with kveld9/kveld-morphe-patches (Morphe based). Non-root APK only.
# The patches pin one Gboard Lite beta build (18.5.1.993608717-lite_beta), "version = auto" picks it.
# "Install a Copy" (on by default) installs it next to the original Gboard (package suffix ".clone").
# The lite beta is usually not on archive.org/APKPure: upload it to the 'stock-apks' release by hand once, as
# com.google.android.inputmethod.latin-18.5.1.993608717-lite_beta-arm64-v8a.apk
# https://github.com/kveld9/kveld-morphe-patches
[GboardLite]
app-name = "Gboard Lite"
pkg-name = "com.google.android.inputmethod.latin"
patches-source = "kveld9/kveld-morphe-patches"
patches-version = "latest"
rv-brand = "Kveld"
build-mode = "apk"
arch = "arm64-v8a"
version = "auto"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/gboard"

# Proton VPN with hxreborn/morphe-patches (Morphe based). Non-root APK only, no MicroG needed.
# Unlocks free plan features (NetShield, split tunneling, custom DNS, LAN, profiles, connection preferences),
# no server change delay, no telemetry and upgrade promotions, AMOLED theme.
# Same package name as the original: uninstall the original Proton VPN before installing.
# Not on archive.org/APKPure: upload the stock bundle to the 'stock-apks' release by hand, as
# ch.protonvpn.android-<version>-arm64-v8a.apkm (or .apk)
# https://github.com/hxreborn/morphe-patches
[ProtonVPN]
app-name = "Proton VPN"
pkg-name = "ch.protonvpn.android"
patches-source = "hxreborn/morphe-patches"
patches-version = "latest"
rv-brand = "hxreborn"
build-mode = "apk"
arch = "arm64-v8a"
version = "auto"
apkmirror-dlurl = "https://www.apkmirror.com/apk/proton-technologies-ag/protonvpn-secure-and-free-vpn"

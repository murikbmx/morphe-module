name: Build Modules
on:
  workflow_call:
    inputs:
      from_ci:
        type: boolean
        required: false
        default: true

  workflow_dispatch:

jobs:
  run:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      # default branch -> stable channel: updates in the 'update' branch, releases marked as latest
      # any other branch (e.g. 'dev') -> its own 'update-<branch>' branch, releases marked as pre-release
      - name: Detect channel
        run: |
          if [ "$GITHUB_REF_NAME" = "${{ github.event.repository.default_branch }}" ]; then
            echo "UPDATE_BRANCH=update" >> "$GITHUB_ENV"
            echo "RELEASE_KIND=--latest" >> "$GITHUB_ENV"
          else
            echo "UPDATE_BRANCH=update-${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"
            echo "RELEASE_KIND=--prerelease" >> "$GITHUB_ENV"
          fi

      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEYSTORE_ALIAS" ]; then
            KS_FILE="$RUNNER_TEMP/release.keystore"
            base64 -d <<<"$KEYSTORE_BASE64" >"$KS_FILE"
            {
              echo "KS_FILE=$KS_FILE"
              echo "KS_PASS=$KEYSTORE_PASSWORD"
              echo "KS_ALIAS=$KEYSTORE_ALIAS"
            } >>"$GITHUB_ENV"
            echo "Using own signing key '$KEYSTORE_ALIAS'"
          else
            echo "::warning::KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEYSTORE_ALIAS secrets are not set. APKs are signed with the PUBLIC key from the repo. Run scripts/make-keystore.sh and add the secrets."
          fi

      - name: Update config
        if: ${{ inputs.from_ci }}
        run: |
          if git checkout "origin/$UPDATE_BRANCH" build.md; then
            UPDATE_CFG=$(./build.sh config.toml --config-update)
            if [ "$UPDATE_CFG" ]; then
              echo "'$UPDATE_CFG'"
              echo "$UPDATE_CFG" > config.json
            fi
          fi

      - name: Get next version code
        id: next_ver_code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # numeric tags only ('stock-apks' is the storage release)
          TAG=$(gh release list -L 400 --json tagName -q '.[].tagName' | grep -E '^[0-9]+$' | sort -n | tail -1 || :)
          if [ -z "$TAG" ]; then TAG=0; fi
          echo "NEXT_VER_CODE=$((TAG + 1))" >> $GITHUB_OUTPUT

      - name: Build modules/APKs
        run: if [ -f "config.json" ]; then ./build.sh config.json; else ./build.sh config.toml; fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NEXT_VER_CODE: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}
          UPDATE_BRANCH: ${{ env.UPDATE_BRANCH }}

      - name: Save stock APKs to the storage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_VERSIONS: 3 # stock versions to keep per app
        run: |
          if [ ! -s temp/stock-upload.list ]; then echo "nothing new to store"; exit 0; fi
          if ! gh release view stock-apks >/dev/null 2>&1; then
            gh release create stock-apks --title "Stock APKs (storage)" --prerelease --latest=false \
              --notes "Original APKs used for the builds. Filled automatically; you can also upload files by hand: <package>-<version>-<arch>.apk (or .apkm for split bundles), e.g. com.google.android.youtube-21.30.216-arm64-v8a.apk"
          fi
          mkdir -p stock-upload
          while IFS='|' read -r SRC NAME; do
            [ -f "$SRC" ] && cp -f "$SRC" "stock-upload/$NAME"
          done < temp/stock-upload.list
          ls -lh stock-upload
          gh release upload stock-apks stock-upload/* --clobber

          # keep only the newest KEEP_VERSIONS versions of every package
          gh release view stock-apks --json assets -q '.assets[].name' | while read -r N; do
            P=${N%%-*}; R=${N#*-}; V=${R%%-*}; echo "$P $V $N"
          done | sort -k1,1 -k2,2Vr | awk -v keep="$KEEP_VERSIONS" '{ if ($1 != p) { p = $1; n = 0; last = "" } if ($2 != last) { n++; last = $2 } if (n > keep) print $3 }' |
            while read -r OLD; do
              echo "Deleting old stock $OLD"
              gh release delete-asset stock-apks "$OLD" --yes || :
            done

      - name: Get output
        id: get_output
        run: |
          DELIM="$(openssl rand -hex 8)"
          echo "BUILD_LOG<<${DELIM}" >> "$GITHUB_OUTPUT"
          cat build.md >> "$GITHUB_OUTPUT"
          echo "${DELIM}" >> "$GITHUB_OUTPUT"
          cp -f build.md build.tmp

          # "App: version" lines of the build log, e.g. "YouTube 21.30.216 · GooglePhotos 7.92.0.977185651"
          APPS=$(sed -n 's/^\([A-Za-z][A-Za-z0-9 ()-]*\): \([0-9][^ ]*\)  *$/\1 \2/p' build.md | sed 's/GooglePhotos/Google Photos/' | paste -sd '|' - | sed 's/|/ · /g')
          VOT_VER=$(sed -n 's|^Patches: sashade8-ship-it/dual-vot-patches/patches-\(.*\)\.[^.]*  *$|\1|p' build.md | head -1)
          TITLE="${APPS:-Release}"
          if [ -n "$VOT_VER" ]; then TITLE+=" · Dual VoT ${VOT_VER}"; fi
          echo "RELEASE_TITLE=${TITLE}" >> "$GITHUB_OUTPUT"

      - name: Upload release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}
          TITLE: ${{ steps.get_output.outputs.RELEASE_TITLE }}
        run: |
          ls -lh ./build/*
          if [ "$RELEASE_KIND" = --prerelease ]; then TITLE+=" (dev)"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file build.tmp
            gh release upload "$TAG" ./build/* --clobber
          else
            gh release create "$TAG" ./build/* --title "$TITLE" --notes-file build.tmp "$RELEASE_KIND"
          fi

      - name: Delete old releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_STABLE: 10 # stable releases to keep
          KEEP_DEV: 5     # pre-releases (dev) to keep
        run: |
          RELS=$(gh release list -L 400 --json tagName,isPrerelease,createdAt | jq 'map(select(.tagName != "stock-apks"))')
          {
            jq -r 'map(select(.isPrerelease | not)) | sort_by(.createdAt) | reverse | .[env.KEEP_STABLE | tonumber:][] | .tagName' <<<"$RELS"
            jq -r 'map(select(.isPrerelease)) | sort_by(.createdAt) | reverse | .[env.KEEP_DEV | tonumber:][] | .tagName' <<<"$RELS"
          } | while read -r OLD; do
            [ -z "$OLD" ] && continue
            echo "Deleting old release $OLD"
            gh release delete "$OLD" --yes --cleanup-tag || :
          done

      - name: Update modules changelog and update json
        id: update_config
        run: |
          git checkout -f "$UPDATE_BRANCH" || git switch --discard-changes --orphan "$UPDATE_BRANCH"
          cp -f build.tmp build.md
          get_update_json() {
            echo "{
            \"version\": \"$1\",
            \"versionCode\": ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }},
            \"zipUrl\": \"$2\",
            \"changelog\": \"https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$UPDATE_BRANCH/build.md\"
          }"
          }

          cd build || { echo "build folder not found"; exit 1; }
          for OUTPUT in *module*.zip; do
            [ "$OUTPUT" = "*module*.zip" ] && continue
            ZIP_S=$(unzip -p "$OUTPUT" module.prop)
            if ! UPDATE_JSON=$(echo "$ZIP_S" | grep updateJson); then continue; fi
            UPDATE_JSON="${UPDATE_JSON##*/}"
            VER=$(echo "$ZIP_S" | grep version=)
            VER="${VER##*=}"
            DLURL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}/${OUTPUT}"
            get_update_json "$VER" "$DLURL" >"../$UPDATE_JSON"
          done
          cd ..

          find . -name "*-update.json" | grep . || : >dummy-update.json

      - name: Commit module json changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
          git add build.md *-update.json
      
          if ! git diff --cached --quiet; then
            git commit -m "Bump version ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}"
            git push origin "HEAD:$UPDATE_BRANCH"
          else
            echo "no changes!"
          fi
